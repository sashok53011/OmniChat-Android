; ESP32 CYD Companion - OmniChat Display
; PlatformIO Configuration

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0

build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_MISO=12
    -DSPI_MOSI=13
    -DSPI_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DXPT2046_CS=33
    -DXPT2046_IRQ=36
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
